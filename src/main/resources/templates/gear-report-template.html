<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1, h2, h3 { color: #f0f6fc; }
        h3 { margin-top: 24px; margin-bottom: 8px; }

        /* Summary Cards */
        .summary { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 24px; min-width: 120px; flex: 1 0 auto; }
        .card .label { font-size: 14px; color: #8b949e; }
        .card .value { font-size: 28px; font-weight: 600; }
        .card .value.keep { color: #2ea043; }
        .card .value.mod { color: #d29922; }
        .card .value.reforge { color: #58a6ff; }
        .card .value.review { color: #f0883e; }
        .card .value.delete { color: #f85149; }
        .card .value.unenhanced { color: #8b949e; }

        /* Charts */
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
        .chart-box h3 { margin-top: 0; }
        .full-width { grid-column: 1 / -1; }
        @media (max-width: 800px) { .chart-grid { grid-template-columns: 1fr; } }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background: #161b22; color: #8b949e; font-weight: 600; position: sticky; top: 0; z-index: 2; }
        tr:hover { background: #1c2128; }
        .table-wrap { max-height: 400px; overflow-y: auto; margin-bottom: 16px; border: 1px solid #30363d; border-radius: 6px; }
        .table-wrap table { border-collapse: collapse; }
        .table-wrap thead { position: sticky; top: 0; z-index: 1; }

        /* Sortable Columns */
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: #f0f6fc; }
        th.sortable::after { content: ' ⇕'; opacity: 0.4; }
        th.sortable.asc::after { content: ' ▲'; opacity: 1; }
        th.sortable.desc::after { content: ' ▼'; opacity: 1; }

        /* Badges */
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge.keep { background: #2ea04333; color: #2ea043; border: 1px solid #2ea04366; }
        .badge.mod { background: #d2992233; color: #d29922; border: 1px solid #d2992266; }
        .badge.reforge { background: #58a6ff33; color: #58a6ff; border: 1px solid #58a6ff66; }
        .badge.review { background: #f0883e33; color: #f0883e; border: 1px solid #f0883e66; }
        .badge.delete { background: #f8514933; color: #f85149; border: 1px solid #f8514966; }
        .badge.unenhanced { background: #8b949e33; color: #8b949e; border: 1px solid #8b949e66; }

        /* Misc */
        .no-data { color: #8b949e; font-style: italic; padding: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ Epic Seven Gear Report</h1>
    <p style="color:#8b949e;">Generated: {{TIMESTAMP}}</p>

    <!-- Summary Cards -->
    {{SUMMARY_CARDS}}

    <!-- Charts -->
    <div class="chart-grid">
        <div class="chart-box">
            <h3>Quality Distribution (+15)</h3>
            <canvas id="qualityChart" width="400" height="300"></canvas>
        </div>
        <div class="chart-box">
            <h3>Quality by Slot (+15)</h3>
            <canvas id="slotChart" width="400" height="300"></canvas>
        </div>
        <div class="chart-box full-width">
            <h3>Quality by Set (+15)</h3>
            <canvas id="setChart" width="800" height="300"></canvas>
        </div>
    </div>

    <!-- DELETE Tables -->
    {{DELETE_SECTIONS}}

    <!-- REFORGE Tables -->
    {{REFORGE_SECTIONS}}

    <!-- Borderline REVIEW -->
    {{REVIEW_TABLE}}

    <!-- All +15 Items -->
    {{ALL_TABLE}}
</div>

<script>
    // Quality Chart
    const qualityCtx = document.getElementById('qualityChart').getContext('2d');
    new Chart(qualityCtx, {
        type: 'doughnut',
        data: {
            labels: {{QUALITY_LABELS}},
    datasets: [{
        data: {{QUALITY_DATA}},
    backgroundColor: ['#2ea043', '#d29922', '#58a6ff', '#f0883e', '#f85149'],
        borderColor: '#0d1117',
        borderWidth: 2
    }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#c9d1d9' } } } }
    });

    // Slot Chart
    const slotCtx = document.getElementById('slotChart').getContext('2d');
    new Chart(slotCtx, {
        type: 'bar',
        data: {
            labels: {{SLOT_LABELS}},
    datasets: [
        { label: 'KEEP', data: {{SLOT_KEEP}}, backgroundColor: '#2ea043' },
    { label: 'MOD CANDIDATE', data: {{SLOT_MOD}}, backgroundColor: '#d29922' },
    { label: 'REFORGE CANDIDATE', data: {{SLOT_REFORGE}}, backgroundColor: '#58a6ff' },
    { label: 'REVIEW', data: {{SLOT_REVIEW}}, backgroundColor: '#f0883e' },
    { label: 'DELETE CANDIDATE', data: {{SLOT_DELETE}}, backgroundColor: '#f85149' }
    ]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#c9d1d9' } } }, scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e', stepSize: 1 } } } }
    });

    // Set Chart
    const setCtx = document.getElementById('setChart').getContext('2d');
    new Chart(setCtx, {
        type: 'bar',
        data: {
            labels: {{SET_LABELS}},
    datasets: [
        { label: 'KEEP', data: {{SET_KEEP}}, backgroundColor: '#2ea043' },
    { label: 'MOD CANDIDATE', data: {{SET_MOD}}, backgroundColor: '#d29922' },
    { label: 'REFORGE CANDIDATE', data: {{SET_REFORGE}}, backgroundColor: '#58a6ff' },
    { label: 'REVIEW', data: {{SLOT_REVIEW}}, backgroundColor: '#f0883e' },
    { label: 'DELETE CANDIDATE', data: {{SET_DELETE}}, backgroundColor: '#f85149' }
    ]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#c9d1d9' } } }, scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e', stepSize: 1 } } } }
    });

    // Generic Table Sorting Delegator for All Items Table
    // Generic Table Sorting Delegator for All Items Table
    document.addEventListener('DOMContentLoaded', () => {
        const table = document.getElementById('all-gear-table');
        if (!table) return;

        const headers = table.querySelectorAll('th.sortable');
        headers.forEach((th, colIndex) => {
            th.addEventListener('click', () => {
                const tbody = table.querySelector('tbody');
                const rows = Array.from(tbody.querySelectorAll('tr'));
                const isNumeric = th.dataset.type === 'number';
                const currentOrder = th.classList.contains('asc') ? 'asc' : (th.classList.contains('desc') ? 'desc' : null);
                const nextOrder = currentOrder === 'asc' ? 'desc' : 'asc';

                headers.forEach(h => h.classList.remove('asc', 'desc'));
                th.classList.add(nextOrder);

                const getVal = (cell) => {
                    if (cell.dataset.sortableValue !== undefined) {
                        return cell.dataset.sortableValue.trim();
                    }
                    const img = cell.querySelector('img');
                    if (img && img.alt) {
                        return img.alt.trim();
                    }
                    return cell.textContent.trim();
                };

                rows.sort((a, b) => {
                    let cellA = getVal(a.children[colIndex]);
                    let cellB = getVal(b.children[colIndex]);

                    if (isNumeric) {
                        let valA = parseFloat(cellA) || 0;
                        let valB = parseFloat(cellB) || 0;
                        return nextOrder === 'asc' ? valA - valB : valB - valA;
                    } else {
                        return nextOrder === 'asc' ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                    }
                });

                tbody.innerHTML = '';
                rows.forEach(row => tbody.appendChild(row));
            });
        });
    });
</script>
</body>
</html>
