plugins {
    id 'java'
    id 'application'
}

group = 'com.e7gear'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Jackson for JSON parsing (gear.txt)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // Optional: Lombok if you want to reduce boilerplate in data classes
    // compileOnly 'org.projectlombok:lombok:1.18.30'
    // annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

application {
    // Define the main class for the application
    mainClass = 'com.e7gear.Main'
}

java {
    // Set Java compatibility.
    // Use VERSION_21 if your Gradle JVM is set to Temurin 21.
    // Use VERSION_17 if you want broader compatibility.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Ensure UTF-8 encoding for compilation (fixes potential emoji/character issues on Windows)
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Task to run the jar with arguments easily
jar {
    manifest {
        attributes 'Main-Class': 'com.e7gear.Main'
    }
    // Include dependencies in the jar (fat jar) if needed,
    // though for local CLI usage 'gradle run' is usually easier.
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}